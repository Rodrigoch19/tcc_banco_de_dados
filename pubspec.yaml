name: safeneighbor
description: SafeNeighbor - plataforma de seguranca comunitaria com mapa de alertas em tempo real.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  google_fonts: ^8.2.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  http: ^1.6.0
  web: ^1.1.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/safeneighbor_logo.jpeg
